name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # هنوز package-lock.json وجود ندارد، پس npm ci ممکن نیست
      - name: Install dependencies
        run: npm install

      # تایپ‌چک جدا از بیلد اجرا می‌شود تا خطاها قبل از تولید dist دیده شوند
      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
